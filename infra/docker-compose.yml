name: cmb-lab

services:
  postgres:
    image: postgres:17-alpine
    container_name: cmblab-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmblab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmblab_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cmblab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmblab} -d ${POSTGRES_DB:-cmblab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cmblab-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: cmblab-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cmblab}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cmblab_dev_password}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket then exits.
  minio-init:
    image: minio/mc:latest
    container_name: cmblab-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-cmblab} ${S3_SECRET_KEY:-cmblab_dev_password} &&
      mc mb --ignore-existing local/${S3_BUCKET:-cmblab} &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
