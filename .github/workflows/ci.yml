name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/cmblab-core
          for s in ingest catalog spectrum cosmology anomaly skymap tutor chat playground; do
            pip install -e "services/$s"
          done
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      # The data-dependent tests need ~170 MB from NASA/ESA, which is too slow and too
      # fragile for CI. Those run locally and are marked `slow` / `network`.
      - name: Test
        run: pytest -q -m "not slow and not network"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # The gateway uses only the standard library, so there is no go.sum for the
          # action to key a cache on.
          cache: false
      - run: cd services/gateway && go vet ./...
      - run: cd services/gateway && go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
