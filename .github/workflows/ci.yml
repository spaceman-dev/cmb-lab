name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/cmblab-core
          for s in ingest catalog spectrum cosmology anomaly skymap tutor chat playground; do
            pip install -e "services/$s"
          done
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      # The data-dependent tests need ~170 MB from NASA/ESA, which is too slow and too
      # fragile for CI. Those run locally and are marked `slow` / `network`.
      - name: Test
        run: pytest -q -m "not slow and not network"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Must match the `go` directive in services/gateway/go.mod.
          go-version: "1.24"
          # The gateway uses only the standard library, so there is no go.sum for the
          # action to key a cache on.
          cache: false
      - run: cd services/gateway && go vet ./...
      - run: cd services/gateway && go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build

  # healpy ships no Windows build, so the services themselves cannot be installed here.
  # What must keep working is the Windows *entry point*: the PowerShell wrapper has to
  # parse, dev.py has to run, and it has to pick Docker/WSL instead of failing natively.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dev.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/dev.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "dev.ps1 parses cleanly"

      - name: dev.py runs on Windows
        run: python scripts/dev.py doctor

      - name: native backend is refused on Windows
        shell: pwsh
        run: |
          python scripts/dev.py --backend native status
          if ($LASTEXITCODE -eq 0) { Write-Error "native should be refused on Windows"; exit 1 }
          Write-Host "correctly refused"
          # pwsh exits with $LASTEXITCODE, which is still 1 from the expected failure above.
          exit 0

      - name: the PowerShell wrapper reaches dev.py
        shell: pwsh
        run: .\scripts\dev.ps1 doctor
