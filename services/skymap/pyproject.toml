[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmblab-skymap"
version = "0.1.0"
description = "cmb-lab skymap service"
requires-python = ">=3.12,<3.14"
dependencies = ["cmblab-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/cmblab_skymap"]

[tool.hatch.metadata]
allow-direct-references = true
