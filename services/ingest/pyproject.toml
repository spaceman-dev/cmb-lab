[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmblab-ingest"
version = "0.1.0"
description = "Archive acquisition and cleaning service for cmb-lab"
requires-python = ">=3.12,<3.14"
dependencies = ["cmblab-core"]

[project.scripts]
cmblab-ingest = "cmblab_ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cmblab_ingest"]

[tool.hatch.metadata]
allow-direct-references = true
