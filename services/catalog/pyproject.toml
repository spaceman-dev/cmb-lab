[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmblab-catalog"
version = "0.1.0"
description = "Dataset and product registry service for cmb-lab"
requires-python = ">=3.12,<3.14"
dependencies = ["cmblab-core", "cmblab-ingest"]

[tool.hatch.build.targets.wheel]
packages = ["src/cmblab_catalog"]

[tool.hatch.metadata]
allow-direct-references = true
