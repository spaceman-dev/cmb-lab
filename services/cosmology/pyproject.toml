[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmblab-cosmology"
version = "0.1.0"
description = "CAMB theory spectra and LCDM parameter inference for cmb-lab"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cmblab-core",
    "cmblab-spectrum",
    "camb>=1.5",
    "emcee>=3.1",
    "getdist>=1.4",
]

[project.scripts]
cmblab-cosmology = "cmblab_cosmology.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cmblab_cosmology"]

[tool.hatch.metadata]
allow-direct-references = true
