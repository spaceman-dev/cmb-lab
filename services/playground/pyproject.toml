[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmblab-playground"
version = "0.1.0"
description = "cmb-lab playground service"
requires-python = ">=3.12,<3.14"
dependencies = ["cmblab-core", "cmblab-spectrum", "cmblab-cosmology"]

[tool.hatch.build.targets.wheel]
packages = ["src/cmblab_playground"]

[tool.hatch.metadata]
allow-direct-references = true
