[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmblab-anomaly"
version = "0.1.0"
description = "cmb-lab anomaly service"
requires-python = ">=3.12,<3.14"
dependencies = ["cmblab-core", "cmblab-cosmology", "scipy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/cmblab_anomaly"]

[tool.hatch.metadata]
allow-direct-references = true
